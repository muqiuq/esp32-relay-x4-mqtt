; ESP32 Relay X4 v1.1 - MQTT roller shutter button emulator
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32 @ ^6.8.1
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; CH340 adapters corrupt data at 921600; 460800 may work, 115200 always does
upload_speed = 115200
; two 1.9 MB app slots for web OTA, no SPIFFS needed (config lives in NVS)
board_build.partitions = min_spiffs.csv
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -Wall
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.2.0
; regenerates src/help_html.h (web /help page) from README.md
extra_scripts = pre:tools/readme_to_help.py

; Flash via USB/serial
[env:esp32dev]

; Flash over the network via the web updater:
;   pio run -e ota -t upload --upload-port <ip-or-hostname>
; If a web password is set, export it first: export RELAY4_WEBPASS=secret
[env:ota]
upload_protocol = custom
upload_command = curl --fail --show-error -u "admin:$${RELAY4_WEBPASS:-}" -F "firmware=@$SOURCE" "http://$UPLOAD_PORT/update"
